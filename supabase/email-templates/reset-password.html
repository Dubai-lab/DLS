<!--
  Supabase > Authentication > Emails > "Reset Password"

  Subject:  Reset your Football League Hub password
  Body:     everything below this comment

  Same reasoning as the signup template: {{ .Token }} is the code the person
  types into reset.html. Supabase's default sends {{ .ConfirmationURL }}, a link
  that opens the phone browser and leaves them outside the app with a session
  the app cannot see.

  Copy {{ .Token }} exactly. A typo ships the literal text and fails silently.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#0a0e14;margin:0;padding:32px 12px;font-family:'Segoe UI',Arial,Helvetica,sans-serif">
  <tr>
    <td align="center">

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:520px;background-color:#12171f;border:1px solid #21262d;border-radius:16px">
        <tr>
          <td style="padding:32px">

            <div style="font-size:19px;font-weight:bold;color:#FFD700;padding-bottom:26px">
              Football League Hub
            </div>

            <div style="font-size:20px;color:#e6edf3;font-weight:bold;padding-bottom:12px">
              Reset your password
            </div>

            <div style="color:#8b949e;font-size:14px;line-height:22px;padding-bottom:24px">
              Enter this code to choose a new password.
            </div>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#161b22;border:1px solid #30363d;border-radius:12px">
              <tr>
                <td align="center" style="padding:22px 12px">
                  <div style="color:#FFD700;font-size:32px;font-weight:bold;letter-spacing:8px;font-family:'Courier New',Courier,monospace">
                    {{ .Token }}
                  </div>
                </td>
              </tr>
            </table>

            <div style="color:#4a5568;font-size:12px;line-height:19px;padding-top:24px">
              The code expires in one hour. If you did not ask to reset your
              password, ignore this email &mdash; nothing has changed, and your
              current password still works.
            </div>

          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
