<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Football League Hub">
  <title>Football League Hub</title>
  <!--
    A club crest carrying the markings of a pitch: halfway line, centre circle,
    centre spot. Chosen over a football because a ball at 32px collapses into a
    grey disc, whereas a shield silhouette stays recognisable, and because a
    crest is the visual language of league football specifically - not just of
    the sport.
  -->
  <defs>
    <linearGradient id="flh-crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE04D"/>
      <stop offset="1" stop-color="#E6AC00"/>
    </linearGradient>
  </defs>

  <path d="M16 1.6 L28.4 5.2 V15.6 C28.4 22.6 23.2 28.2 16 30.4
           C8.8 28.2 3.6 22.6 3.6 15.6 V5.2 Z"
        fill="url(#flh-crest)"/>

  <g stroke="#1A1400" stroke-width="1.7" fill="none" stroke-linecap="round">
    <path d="M6.2 16 H25.8"/>
    <circle cx="16" cy="16" r="4.3"/>
  </g>
  <circle cx="16" cy="16" r="1.25" fill="#1A1400"/>
</svg>
