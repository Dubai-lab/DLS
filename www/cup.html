<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cup — Football League Hub</title>
<meta name="theme-color" content="#0a0e14">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="css/platform.css">
<style>
  .comp-head { padding: 20px 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .comp-head-inner { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .comp-title { font-size: 1.4rem; font-weight: 900; letter-spacing: -.4px; }
  .comp-sub { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .head-actions { margin-left: auto; display: flex; gap: 9px; align-items: center; }
  .save-state { font-size: .74rem; color: var(--faint); min-width: 90px; text-align: right; }

  .tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab {
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    border-radius: 10px; padding: 9px 17px; font-size: .82rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .tab.on { background: rgba(255,215,0,.1); border-color: rgba(255,215,0,.4); color: var(--gold); }
  .panel { display: none; } .panel.on { display: block; }

  .empty {
    border: 1px dashed var(--line-soft); border-radius: var(--radius);
    padding: 36px 20px; text-align: center; color: var(--muted); font-size: .88rem;
  }
  .empty strong { color: var(--text); display: block; margin-bottom: 6px; font-size: .95rem; }

  .team-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 11px; padding: 12px 15px; margin-bottom: 8px;
  }
  .team-badge {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: var(--surface-2); border: 1px solid var(--line-soft);
    display: grid; place-items: center; font-size: .72rem; font-weight: 800; color: var(--muted);
  }
  .team-name { font-weight: 700; font-size: .9rem; }
  .team-meta { color: var(--faint); font-size: .74rem; margin-top: 2px; }

  /* Groups */
  .group-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 18px; }
  .group-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .group-card h3 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: 2px;
    color: var(--gold); font-weight: 800; margin-bottom: 12px;
  }
  .gstd-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
  .gstd-wrap::-webkit-scrollbar { height: 0; }
  .gstd { width: 100%; border-collapse: collapse; font-size: .8rem; margin-bottom: 14px; }
  .gstd th {
    text-align: left; font-size: .6rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); font-weight: 800; padding: 0 6px 8px;
  }
  .gstd td { padding: 8px 6px; border-top: 1px solid var(--line); }
  .gstd .num { text-align: center; width: 30px; }
  .gstd .pts { font-weight: 800; color: var(--gold); }
  /* The qualifying places carry a marker, so the cut line is visible at a glance. */
  .gstd tr.qualifies td:first-child { box-shadow: inset 3px 0 0 var(--green); }

  .gmatch { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-bottom: 6px; }
  .gmatch span { font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gmatch .away { text-align: right; }
  .score { display: flex; align-items: center; gap: 5px; }
  .score input {
    width: 40px; padding: 6px 3px; text-align: center; font-size: .9rem; font-weight: 800;
    background: var(--surface-2); border: 1.5px solid var(--line-soft);
    border-radius: 8px; color: var(--text); outline: none; font-family: inherit;
  }
  .score input:focus { border-color: var(--gold); }
  .score em { color: var(--faint); font-style: normal; }

  /* Bracket */
  .bracket { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 10px; }
  .round { flex: 0 0 250px; display: flex; flex-direction: column; justify-content: space-around; gap: 12px; }
  .round-name {
    font-size: .66rem; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); font-weight: 800; text-align: center; margin-bottom: 4px;
  }
  .tie { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; }
  .tie-side { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .tie-side span { flex: 1; font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tie-side.won span { font-weight: 800; color: var(--green); }
  .tie-side.tbd span { color: var(--faint); font-style: italic; }
  .tie-side input {
    width: 38px; padding: 5px 3px; text-align: center; font-weight: 800;
    background: var(--surface-2); border: 1.5px solid var(--line-soft);
    border-radius: 7px; color: var(--text); outline: none; font-family: inherit; font-size: .85rem;
  }
  .tie-side input:focus { border-color: var(--gold); }
  .tie-side input:disabled { opacity: .35; }
  .pens {
    margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line-soft);
    font-size: .68rem; color: var(--muted); display: flex; align-items: center; gap: 7px;
  }
  .pens select {
    flex: 1; background: var(--surface-2); border: 1px solid var(--line-soft);
    border-radius: 7px; color: var(--text); padding: 4px 6px; font-size: .7rem; font-family: inherit;
  }
  .champion {
    background: linear-gradient(135deg, rgba(255,215,0,.14), rgba(255,215,0,.04));
    border: 1.5px solid rgba(255,215,0,.45); border-radius: var(--radius);
    padding: 20px; text-align: center; margin-bottom: 20px;
  }
  .champion .who { font-size: 1.3rem; font-weight: 900; color: var(--gold); margin-top: 5px; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--line-soft); color: var(--text);
    border-radius: 10px; padding: 11px 20px; font-size: .85rem; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 300;
  }
  .toast.show { opacity: 1; }

  /* Submitted results */
  #pending-dot:not(:empty) {
    display: inline-grid; place-items: center; min-width: 18px; height: 18px;
    margin-left: 6px; padding: 0 5px; border-radius: 9px;
    background: var(--red); color: #fff; font-size: .62rem; font-weight: 900;
  }
  .sub {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  .sub.done { opacity: .55; }
  .sub-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .sub-fixture { font-weight: 800; font-size: .92rem; }
  .sub-meta { color: var(--faint); font-size: .74rem; }
  .sub-claim {
    margin-left: auto; font-size: .74rem; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 20px; padding: 4px 12px; white-space: nowrap;
  }
  .sub-shots { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .sub-shots a {
    display: block; width: 96px; height: 128px; border-radius: 10px; overflow: hidden;
    background: var(--surface-2); border: 1px solid var(--line-soft);
  }
  .sub-shots img { width: 100%; height: 100%; object-fit: cover; }
  .sub-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sub-actions .score { margin-right: auto; }
  .sub-team { border-top: 1px solid var(--line); padding-top: 12px; margin-bottom: 12px; }
  .sub-team-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .84rem; }
  .sub-team-head .ok { color: var(--green); }
  .sub-team-head .missing { color: var(--faint); font-size: .6rem; }
</style>
</head>
<body>

<div class="wrap">

  <header class="comp-head">
    <div class="comp-head-inner">
      <a href="console.html" class="btn btn-ghost" style="padding:8px 14px;font-size:.78rem">&#8592; Console</a>
      <div>
        <div class="comp-title" id="comp-title">…</div>
        <div class="comp-sub" id="comp-sub"></div>
      </div>
      <div class="head-actions">
        <span class="save-state" id="save-state"></span>
        <button class="btn btn-primary" id="btn-publish" style="padding:9px 18px;font-size:.8rem">Publish</button>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="teams">Teams</button>
    <button class="tab" data-tab="groups">Group stage</button>
    <button class="tab" data-tab="knockout">Knockout</button>
    <button class="tab" data-tab="results">Results <span id="pending-dot"></span></button>
  </div>

  <section class="panel on" id="panel-teams">
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:16px">
      Teams come from the players you registered. To add one, register its player
      in the <a href="console.html" style="color:var(--gold)">console</a>.
    </p>
    <div id="team-list"><div class="empty">Loading…</div></div>
    <div id="draw-box" style="margin-top:22px"></div>
  </section>

  <section class="panel" id="panel-groups">
    <div id="groups-body"><div class="empty">Loading…</div></div>
  </section>

  <section class="panel" id="panel-knockout">
    <div id="ko-body"><div class="empty">Loading…</div></div>
  </section>

  <section class="panel" id="panel-results">
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:16px">
      Screenshots players sent from the app. Check the image, confirm or correct
      the score, and accept — that is what writes it into the group table.
    </p>
    <div id="results-body"><div class="empty">Loading…</div></div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script src="js/brand.js"></script>
<script src="js/api.js"></script>
<script src="js/db.js"></script>
<script src="js/dialog.js"></script>
<script src="js/competition.js"></script>
<script src="js/native.js"></script>
<script>
(function () {
'use strict';

const $ = id => document.getElementById(id);
const compId = new URLSearchParams(location.search).get('c');

let competition = null;
let feeders = [];          // divisions that send teams to this cup
let members = [];
let state = null;
let docPath = '';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2400);
}
function initials(name) {
  return String(name || '?').split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
}
/** Crest for a team name: uploaded image, else initials on the team colour. */
function crest(teamName, px) {
  const size = px || 30;
  const m = members.find(x => x.team === teamName);
  if (m && m.logo_url) {
    return `<img class="team-badge" src="${esc(m.logo_url)}" alt=""
                 style="width:${size}px;height:${size}px;object-fit:cover;background:#fff" loading="lazy">`;
  }
  const colour = (m && m.jersey) || '#8b949e';
  return `<span class="team-badge" style="width:${size}px;height:${size}px;
               background:${esc(colour)}22;border-color:${esc(colour)}66;color:${esc(colour)}">
            ${esc(initials(teamName))}</span>`;
}

function setSaveState(text, color) {
  $('save-state').textContent = text || '';
  $('save-state').style.color = color || 'var(--faint)';
}

/* ── persistence: the server is the source of truth ─────────────────── */

let saveTimer = null;
function scheduleSave() {
  setSaveState('Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 900);
}
async function save() {
  try {
    await DB.set(docPath, state);
    setSaveState('Saved', 'var(--green)');
  } catch (e) {
    setSaveState('Not saved', 'var(--red)');
    toast(e.isPermission ? 'You do not have permission to edit this competition'
                         : 'Save failed: ' + e.message);
  }
}

/* ── boot ───────────────────────────────────────────────────────────── */

(async () => {
  if (!(await DB.auth.isSignedIn())) { location.replace('login.html'); return; }
  if (!DB.tenant.get())              { location.replace('login.html'); return; }
  if (!compId) { fatal('No competition selected.'); return; }

  try {
    const rows = await DB.competitions();
    competition = rows.find(c => c.id === compId);
    if (!competition) { fatal('That competition does not exist, or you cannot access it.'); return; }

    if (competition.format === 'round_robin') {
      location.replace('league.html?c=' + encodeURIComponent(compId));
      return;
    }

    docPath = `comp/${competition.key}/admin`;
    $('comp-title').textContent = competition.name;
    $('comp-sub').textContent = `Season ${competition.season} · ${DB.tenant.get().tenant_name}`;
    document.title = `${competition.name} — Football League Hub`;

    const [doc, allMembers, feeds] = await Promise.all([
      DB.get(docPath).catch(() => null),
      DB.members().catch(() => []),
      DB.cupFeeders(compId).catch(() => [])
    ]);
    feeders = feeds;

    state = doc || { phase: 'setup', teams: [], groups: {}, fixtures: {}, ko: [] };
    state.teams = state.teams || [];
    state.groups = state.groups || {};
    state.fixtures = state.fixtures || {};
    state.ko = state.ko || [];

    members = allMembers.filter(m =>
      m.role === 'player' && m.team &&
      (!m.competition_ids?.length || m.competition_ids.includes(compId)));

    renderTeams(); renderGroups(); renderKnockout(); loadSubmissions();
  } catch (e) {
    fatal(e.message);
  }
})();

function fatal(message) {
  document.querySelector('.wrap').innerHTML =
    `<div class="empty" style="margin-top:60px"><strong>Cannot open this competition</strong>${esc(message)}
     <div style="margin-top:18px"><a class="btn btn-ghost" href="console.html">Back to console</a></div></div>`;
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
    tab.classList.add('on');
    $('panel-' + tab.dataset.tab).classList.add('on');
  });
});

/* ── teams and the draw ─────────────────────────────────────────────── */

function registeredTeams() { return members.map(m => m.team).filter(Boolean); }

function renderTeams() {
  const teams = registeredTeams();

  $('team-list').innerHTML = teams.length
    ? members.map(m => `
        <div class="team-row">
          ${crest(m.team)}
          <div style="flex:1;min-width:0">
            <div class="team-name">${esc(m.team)}</div>
            <div class="team-meta">${esc(m.display_name || m.email || '')}${
              m.status === 'invited' ? ' · not signed in yet' : ''}</div>
          </div>
        </div>`).join('')
    : `<div class="empty"><strong>No teams yet</strong>
         Register your players in the console — each one brings their team.</div>`;

  const box = $('draw-box');

  // Whoever feeds this cup set the rule on their own division, so the card
  // just reports what those divisions add up to.
  const totalQualifying = feeders.reduce((n, f) => n + (f.qualify_count || 0), 0);
  const qualifyCard = totalQualifying
    ? `<div class="card" style="margin-bottom:14px">
         <h3 style="margin-bottom:6px">Entrants from the divisions</h3>
         <p style="color:var(--muted);font-size:.85rem;margin-bottom:14px">
           ${feeders.map(f => `${f.qualify_count} from ${esc(f.name)}`).join(' · ')}.
           Taken from each division's final table. They keep playing their
           division as well.
         </p>
         <button class="btn btn-ghost" id="btn-qualify">Bring in the entrants (${totalQualifying})</button>
       </div>`
    : '';

  if (teams.length < 4) {
    box.innerHTML = qualifyCard + (teams.length
      ? `<div class="empty">A cup needs at least 4 teams. You have ${teams.length}.</div>`
      : '');
    const qb = $('btn-qualify');
    if (qb) qb.addEventListener('click', bringInQualifiers);
    return;
  }

  // The bracket has to halve cleanly, so the group count must be a power of two.
  const options = [2, 4, 8].filter(n => teams.length >= n * 2);
  const drawn = Object.keys(state.groups).length > 0;

  box.innerHTML = qualifyCard + `
    <div class="card">
      <h3 style="margin-bottom:6px">${drawn ? 'Redo the draw' : 'Make the draw'}</h3>
      <p style="color:var(--muted);font-size:.85rem;margin-bottom:14px">
        ${teams.length} teams. Top two from each group reach the knockout.
        ${drawn ? '<strong style="color:var(--red)">Redrawing erases this season entirely — results, groups and bracket. ' +
          'To start a new season and keep the old one, use End season below.</strong>' : ''}
      </p>
      <div class="field" style="max-width:220px">
        <label for="group-count">Number of groups</label>
        <select class="input" id="group-count">
          ${options.map(n => `<option value="${n}" ${
            Object.keys(state.groups).length === n ? 'selected' : ''
          }>${n} groups → ${n * 2} qualify</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary" id="btn-draw">${drawn ? 'Redraw' : 'Draw groups'}</button>
    </div>`;

  $('btn-draw').addEventListener('click', doDraw);
  const qb = $('btn-qualify');
  if (qb) qb.addEventListener('click', bringInQualifiers);
  const endBtn = $('btn-end-season');
  if (endBtn) endBtn.addEventListener('click', endSeason);
}

async function doDraw() {
  const teams = registeredTeams();
  if (Object.keys(state.groups).length &&
      !await Dialog.confirm(
        'Every result already entered is cleared and the groups are drawn again.',
        { title: 'Redraw the groups?', confirmLabel: 'Redraw',
          danger: true })) {
    return;
  }

  const count = Number($('group-count').value);
  state.teams = teams;
  state.groups = Competition.makeGroups(teams, count);
  state.fixtures = Competition.groupFixtures(state.groups);
  state.ko = [];
  state.phase = 'group';

  scheduleSave();
  renderTeams(); renderGroups(); renderKnockout();
  toast(`Drawn into ${count} groups`);
  document.querySelector('.tab[data-tab="groups"]').click();
}

/* ── group stage ────────────────────────────────────────────────────── */

function renderGroups() {
  const body = $('groups-body');
  const names = Object.keys(state.groups);

  if (!names.length) {
    body.innerHTML = `<div class="empty"><strong>No groups yet</strong>
      Make the draw from the Teams tab.</div>`;
    return;
  }

  body.innerHTML = `<div class="group-grid">${names.map(g => {
    const table = Competition.groupTable(state.groups[g], state.fixtures[g]);
    return `<div class="group-card">
      <h3>Group ${esc(g)}</h3>
      <div class="gstd-wrap"><table class="gstd">
        <thead><tr><th>Team</th><th class="num">P</th><th class="num">W</th>
          <th class="num">D</th><th class="num">L</th><th class="num">GD</th><th class="num">Pts</th></tr></thead>
        <tbody>${table.map((r, i) => `
          <tr class="${i < 2 ? 'qualifies' : ''}">
            <td>${esc(r.team)}</td>
            <td class="num">${r.p}</td><td class="num">${r.w}</td>
            <td class="num">${r.d}</td><td class="num">${r.l}</td>
            <td class="num">${r.gd > 0 ? '+' : ''}${r.gd}</td>
            <td class="num pts">${r.pts}</td>
          </tr>`).join('')}</tbody>
      </table></div>
      ${(state.fixtures[g] || []).map((m, i) => `
        <div class="gmatch">
          <span>${esc(m.home)}</span>
          <div class="score">
            <input type="number" min="0" max="99" value="${m.hs ?? ''}" data-g="${esc(g)}" data-i="${i}" data-f="hs">
            <em>–</em>
            <input type="number" min="0" max="99" value="${m.as ?? ''}" data-g="${esc(g)}" data-i="${i}" data-f="as">
          </div>
          <span class="away">${esc(m.away)}</span>
        </div>`).join('')}
    </div>`;
  }).join('')}</div>
  <div style="margin-top:20px">${advanceBoxHTML()}</div>`;

  body.querySelectorAll('.score input').forEach(input => {
    input.addEventListener('input', () => {
      const m = state.fixtures[input.dataset.g][Number(input.dataset.i)];
      const raw = input.value.trim();
      m[input.dataset.f] = raw === '' ? null : Math.max(0, Number(raw));
      m.played = typeof m.hs === 'number' && typeof m.as === 'number';
      scheduleSave();
      renderGroups();       // standings and the advance button both depend on this
      restoreFocus(input);
    });
  });

  const advance = $('btn-advance');
  if (advance) advance.addEventListener('click', doAdvance);
}

// Re-rendering the panel drops the caret; put it back so typing stays fluid.
function restoreFocus(oldInput) {
  const sel = `.score input[data-g="${oldInput.dataset.g}"][data-i="${oldInput.dataset.i}"][data-f="${oldInput.dataset.f}"]`;
  const next = document.querySelector(sel);
  if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
}

function unplayedGroupMatches() {
  return Object.values(state.fixtures).flat().filter(m => !m.played).length;
}

function advanceBoxHTML() {
  const left = unplayedGroupMatches();
  if (state.ko && state.ko.length) {
    return `<div class="empty">Knockout stage is under way. Redrawing the groups would clear it.</div>`;
  }
  return `<div class="card">
    <h3 style="margin-bottom:6px">Advance to the knockout</h3>
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:14px">
      ${left ? `${left} group match${left === 1 ? '' : 'es'} still need a score.`
             : 'All group matches are in. The top two from each group go through.'}
    </p>
    <button class="btn btn-primary" id="btn-advance" ${left ? 'disabled' : ''}>
      Build the bracket
    </button>
  </div>`;
}

function doAdvance() {
  try {
    const qualified = Competition.qualifiers(state.groups, state.fixtures, 2);
    state.ko = Competition.seedBracket(qualified);
    state.phase = 'knockout';
    scheduleSave();
    renderGroups(); renderKnockout();
    toast('Bracket built');
    document.querySelector('.tab[data-tab="knockout"]').click();
  } catch (e) {
    toast(e.message);
  }
}

/* ── knockout ───────────────────────────────────────────────────────── */

function renderKnockout() {
  const body = $('ko-body');

  if (!state.ko || !state.ko.length) {
    body.innerHTML = `<div class="empty"><strong>No bracket yet</strong>
      Finish the group stage, then build the bracket from the Group stage tab.</div>`;
    return;
  }

  const winner = Competition.champion(state.ko);

  body.innerHTML = `
    ${winner ? `<div class="champion">
      <div style="font-size:1.9rem">&#127942;</div>
      <div style="color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:2px">Champion</div>
      <div class="who">${esc(winner)}</div>
    </div>` : ''}
    <div class="bracket">${state.ko.map((round, r) => `
      <div class="round">
        <div class="round-name">${esc(round.name)}</div>
        ${round.matches.map((m, i) => tieHTML(round, r, i, m)).join('')}
      </div>`).join('')}
    </div>`;

  body.querySelectorAll('.tie-side input').forEach(input => {
    input.addEventListener('input', () => {
      const m = state.ko[Number(input.dataset.r)].matches[Number(input.dataset.i)];
      const raw = input.value.trim();
      m[input.dataset.f] = raw === '' ? null : Math.max(0, Number(raw));
      state.ko = Competition.advanceBracket(state.ko);
      scheduleSave();
      renderKnockout();
      const sel = `.tie-side input[data-r="${input.dataset.r}"][data-i="${input.dataset.i}"][data-f="${input.dataset.f}"]`;
      const next = document.querySelector(sel);
      if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
    });
  });

  body.querySelectorAll('.pens select').forEach(sel => {
    sel.addEventListener('change', () => {
      const m = state.ko[Number(sel.dataset.r)].matches[Number(sel.dataset.i)];
      m.winner = sel.value || null;
      state.ko = Competition.advanceBracket(state.ko);
      scheduleSave();
      renderKnockout();
    });
  });
}

function tieHTML(round, r, i, m) {
  const ready = m.home && m.away;
  const level = typeof m.hs === 'number' && typeof m.as === 'number' && m.hs === m.as;

  const side = (which) => {
    const team = m[which];
    const won = team && m.winner === team;
    return `<div class="tie-side ${won ? 'won' : ''} ${team ? '' : 'tbd'}">
      <span>${team ? esc(team) : 'To be decided'}</span>
      <input type="number" min="0" max="99" value="${m[which === 'home' ? 'hs' : 'as'] ?? ''}"
             data-r="${r}" data-i="${i}" data-f="${which === 'home' ? 'hs' : 'as'}"
             ${ready ? '' : 'disabled'}>
    </div>`;
  };

  return `<div class="tie">
    ${side('home')}
    ${side('away')}
    ${level ? `<div class="pens">
      <span>Level — won on penalties by</span>
      <select data-r="${r}" data-i="${i}">
        <option value="">—</option>
        <option value="${esc(m.home)}" ${m.winner === m.home ? 'selected' : ''}>${esc(m.home)}</option>
        <option value="${esc(m.away)}" ${m.winner === m.away ? 'selected' : ''}>${esc(m.away)}</option>
      </select>
    </div>` : ''}
  </div>`;
}

/* ── submitted results ──────────────────────────────────────────────────
   Players upload a screenshot and the score they believe it was. Accepting is
   what writes that score into the competition - the claim on its own changes
   nothing, which is the point of reviewing it.
   -------------------------------------------------------------------- */

let submissions = [];

/**
 * Locate a fixture from the reference the app recorded.
 * A cup has two shapes: 'grp:A/m:4' for a group match, keyed on the match id,
 * and 'ko:1/m:0' for a knockout tie, keyed on its position in the round -
 * bracket slots have no stable id of their own.
 */
function matchFromRef(ref) {
  const [head, tail] = String(ref).split('/');
  const n = Number((tail || '').replace('m:', ''));

  if (head.startsWith('grp:')) {
    const group = head.slice(4);
    const match = (state.fixtures[group] || []).find(m => m.id === n);
    return match ? { match, group } : null;
  }

  if (head.startsWith('ko:')) {
    const r = Number(head.slice(3));
    const round = (state.ko || [])[r];
    const match = round && round.matches[n];
    return match ? { match, round: r, index: n } : null;
  }

  return null;
}

async function loadSubmissions() {
  try {
    submissions = (await DB.submissions(competition.id)) || [];
  } catch (e) {
    submissions = [];
  }
  const pending = submissions.filter(s => s.status === 'pending').length;
  $('pending-dot').textContent = pending || '';
  renderSubmissions();
}

function renderSubmissions() {
  const body = $('results-body');
  if (!submissions.length) {
    body.innerHTML = `<div class="empty"><strong>Nothing submitted yet</strong>
      Screenshots players upload from the app appear here, grouped by fixture.</div>`;
    return;
  }

  // Grouped by fixture rather than one card per upload: both players may send a
  // screenshot for the same match, and you want them side by side with one
  // score box - not two rows describing the same game.
  const byFixture = new Map();
  for (const s of submissions) {
    if (!byFixture.has(s.match_ref)) byFixture.set(s.match_ref, []);
    byFixture.get(s.match_ref).push(s);
  }

  const groups = [...byFixture.entries()].map(([ref, rows]) => ({
    ref, rows,
    found: matchFromRef(ref),
    open: rows.some(r => r.status === 'pending'),
    newest: rows.reduce((a, b) => new Date(a.created_at) > new Date(b.created_at) ? a : b)
  })).sort((a, b) =>
    (a.open ? 0 : 1) - (b.open ? 0 : 1) ||
    new Date(b.newest.created_at) - new Date(a.newest.created_at));

  body.innerHTML = groups.map(g => {
    const m = g.found && g.found.match;
    const title = m
      ? `${esc(m.home)} <span style="color:var(--faint);font-weight:600">v</span> ${esc(m.away)}`
      : `<span style="color:var(--red)">fixture no longer exists</span>`;

    // Who has and has not sent one - the thing you actually want to know.
    const roster = (m ? [m.home, m.away] : []).map(side => ({
      side,
      sent: g.rows.filter(r => (r.team || '').toLowerCase() === side.toLowerCase())
    }));

    const when = new Date(g.newest.created_at).toLocaleString(undefined,
      { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

    return `<div class="sub ${g.open ? '' : 'done'}">
      <div class="sub-head">
        <div>
          <div class="sub-fixture">${title}</div>
          <div class="sub-meta">last upload ${esc(when)}${g.open ? '' : ' &middot; ' + esc(g.newest.status)}</div>
        </div>
        <span class="sub-claim">${g.rows.length} upload${g.rows.length === 1 ? '' : 's'}</span>
      </div>

      ${roster.map(({ side, sent }) => `
        <div class="sub-team">
          <div class="sub-team-head">
            <span class="${sent.length ? 'ok' : 'missing'}">${sent.length ? '&#10003;' : '&#9679;'}</span>
            <strong>${esc(side)}</strong>
            <span class="sub-meta">${sent.length ? 'uploaded' : 'has not uploaded'}</span>
          </div>
          ${sent.length ? `<div class="sub-shots" data-shots="${esc(sent.map(x => x.id).join(','))}"></div>` : ''}
        </div>`).join('')}

      ${g.open && m ? `<div class="sub-actions">
        <div class="score">
          <input type="number" min="0" max="99" id="rh-${esc(g.ref)}" placeholder="0">
          <em>&ndash;</em>
          <input type="number" min="0" max="99" id="ra-${esc(g.ref)}" placeholder="0">
        </div>
        <button class="btn btn-primary" data-accept="${esc(g.ref)}"
                style="padding:9px 18px;font-size:.8rem">Enter score &amp; publish</button>
        <button class="btn btn-ghost" data-reject="${esc(g.ref)}"
                style="padding:9px 16px;font-size:.8rem;border-color:rgba(248,113,113,.4);color:var(--red)">Ask again</button>
      </div>` : ''}
      ${g.rows.filter(r => r.review_note).map(r =>
        `<div class="sub-meta" style="margin-top:8px">Sent back: ${esc(r.review_note)}</div>`).join('')}
    </div>`;
  }).join('');

  body.querySelectorAll('[data-accept]').forEach(b =>
    b.addEventListener('click', () => acceptFixture(b.dataset.accept)));
  body.querySelectorAll('[data-reject]').forEach(b =>
    b.addEventListener('click', () => rejectFixture(b.dataset.reject)));

  loadShots();
}

/**
 * Screenshots live in a private bucket, so each needs a short-lived signed URL.
 * Fetched after the cards render, so a slow image never holds up the list.
 */
async function loadShots() {
  for (const box of document.querySelectorAll('[data-shots]')) {
    const ids = box.dataset.shots.split(',');
    const rows = submissions.filter(s => ids.includes(String(s.id)));
    const paths = rows.flatMap(r => r.image_paths || []);
    if (!paths.length) { box.innerHTML = ''; continue; }
    try {
      const urls = await Promise.all(paths.map(p => DB.signedResultUrl(p, 3600)));
      box.innerHTML = urls.map(u =>
        `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`
      ).join('');
    } catch (e) {
      box.innerHTML = `<div class="sub-meta">Could not load the screenshots</div>`;
    }
  }
}

/** Enter the score for a fixture and close every upload attached to it. */
async function acceptFixture(ref) {
  const found = matchFromRef(ref);
  if (!found) { toast('That fixture no longer exists'); return; }

  const home = $(`rh-${ref}`).value.trim();
  const away = $(`ra-${ref}`).value.trim();
  if (home === '' || away === '') { toast('Enter the score first'); return; }

  applyScore(found, Math.max(0, Number(home)), Math.max(0, Number(away)));
  await save();

  // Both players may have uploaded; one score settles all of them.
  for (const s of submissions.filter(s => s.match_ref === ref && s.status === 'pending')) {
    try { await DB.reviewSubmission(s.id, { status: 'accepted' }); }
    catch (e) { toast('Score applied, but an upload could not be closed'); }
  }

  // Saving alone only updates the admin copy. Publish too, or the score
  // never reaches the players - which is what the button promises.
  try {
    await publish();
  } catch (e) {
    toast('Score saved, but publishing failed: ' + e.message);
  }

  refreshAfterScore();
  await loadSubmissions();
  toast('Result published to the app');
}

/** Send a fixture back so the players upload something clearer. */
async function rejectFixture(ref) {
  const note = await Dialog.prompt('Both players see this on the fixture.',
    { title: 'What do you need from them?',
      placeholder: 'e.g. the full-time screen, not the highlights' });
  if (note === null) return;
  try {
    for (const s of submissions.filter(s => s.match_ref === ref && s.status === 'pending')) {
      await DB.reviewSubmission(s.id, { status: 'rejected', review_note: note.trim() || null });
    }
    await loadSubmissions();
    toast('Sent back - they can upload again');
  } catch (e) {
    toast(e.message);
  }
}

function applyScore(found, home, away) {
  found.match.hs = home;
  found.match.as = away;
  found.match.played = true;
  // A knockout tie also has to carry its winner into the next round.
  if (found.round != null) state.ko = Competition.advanceBracket(state.ko);
}
function refreshAfterScore() { renderGroups(); renderKnockout(); }

/* ── ending a season ────────────────────────────────────────────────────
   Regenerating fixtures destroys the season that was there. Ending one
   archives the published snapshot first, so last season's table survives and
   players can still look it up - the way any real league keeps its history.
   -------------------------------------------------------------------- */

/* ── entrants from the divisions ─────────────────────────────────
   Each division decides how many of its sides come here, so a cup can draw
   8 from Division 1, 4 from Division 2 and 4 from Division 3 without knowing
   anything about them itself. Qualifying adds the cup; a side keeps playing
   the division it came from.
   -------------------------------------------------------------------- */

async function bringInQualifiers() {
  if (!feeders.length) {
    toast('No division sends teams here yet — set that under Season rules on the division');
    return;
  }

  const btn = $('btn-qualify');
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = 'Checking the tables…';

  try {
    // One list per division, in the order the divisions are ranked, so the
    // confirmation reads the way the organiser thinks about it.
    const lists = [];
    for (const f of feeders) {
      const table = (await DB.finalTable(f.id).catch(() => null)) || [];
      if (!table.length) {
        toast(`${f.name} has not published a table yet`);
        return;
      }
      lists.push({
        id: f.id, name: f.name,
        teams: table.slice(0, f.qualify_count).map(r => r.team)
      });
    }

    // A side can only be entered once, however many divisions name it.
    const seen = new Set();
    const teams = [];
    lists.forEach(l => l.teams.forEach(t => {
      const k = (t || '').toLowerCase();
      if (t && !seen.has(k)) { seen.add(k); teams.push(t); }
    }));

    if (!teams.length) { toast('Those divisions have no teams to send'); return; }

    const summary = lists.map(l =>
      `${l.name}\n` + l.teams.map((t, i) => `  ${i + 1}. ${t}`).join('\n')
    ).join('\n\n');

    if (!await Dialog.confirm(`${summary}\n\nThey keep playing their divisions as well.`,
          { title: `Enter ${teams.length} teams into ${competition.name}?`,
            confirmLabel: 'Enter them' })) {
      return;
    }

    // One call per division, so each side keeps the division it came from.
    // from: null - qualifying adds the cup, it does not move anyone out.
    let moved = 0;
    for (const l of lists) {
      if (!l.teams.length) continue;
      moved += await DB.moveMembers({
        from: null, to: competition.id, teams: l.teams, keep: l.id
      });
    }

    members = (await DB.members()).filter(m =>
      m.role === 'player' && m.team &&
      (!m.competition_ids?.length || m.competition_ids.includes(competition.id)));

    renderTeams();
    toast(`${moved} team${moved === 1 ? '' : 's'} entered — now make the draw`);
  } catch (e) {
    toast('Could not bring in qualifiers: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

async function endSeason() {
  const finished = {
    season: competition.season,
    endedAt: Date.now(),
    format: 'group_knockout',
    teams: state.teams,
    groups: state.groups,
    fixtures: state.fixtures,
    standings: Object.fromEntries(Object.keys(state.groups).map(g =>
      [g, Competition.groupTable(state.groups[g], state.fixtures[g])])),
    ko: state.ko,
    champion: Competition.champion(state.ko)
  };

  if (!await Dialog.confirm(
      `This season's table and results are archived and stay readable in the app.\n` +
      `The new season starts with no fixtures, and your teams carry over.`,
      { title: `End Season ${competition.season} and start Season ${competition.season + 1}?`,
        confirmLabel: 'End the season' })) {
    return;
  }

  const btn = $('btn-end-season');
  if (btn) { btn.disabled = true; btn.textContent = 'Ending season…'; }

  try {
    // Publish first: the archive stores exactly what players last saw, so the
    // history cannot disagree with the table they remember.
    clearTimeout(saveTimer);
    await save();
    await publish();

    const next = await DB.rollSeason(competition.id, finished);

    // Clear the working copy for the new season. Teams come from the member
    // list, so they are not stored here and carry over on their own.
    state.matchdays = [];
    state.generated = false;
    state.currentDay = 0;
    state.groups = {}; state.fixtures = {}; state.ko = []; state.phase = 'setup';
    await save();
    await publish();

    competition.season = next;
    $('comp-sub').textContent =
      `Season ${next} · ${DB.tenant.get().tenant_name}`;

    renderTeams(); renderGroups(); renderKnockout();
    toast(`Season ${next} started — last season is archived`);
  } catch (e) {
    toast('Could not end the season: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'End season'; }
  }
}

/* ── publish ────────────────────────────────────────────────────────── */

/**
 * Write the published snapshot players read.
 *
 * Called by the Publish button and by accepting a result. Saving only
 * updates the admin document; until this runs, the app shows the old
 * table - which is why accepting used to appear to do nothing.
 */
async function publish() {

    clearTimeout(saveTimer);
    await save();

    const standings = {};
    for (const g of Object.keys(state.groups)) {
      standings[g] = Competition.groupTable(state.groups[g], state.fixtures[g]);
    }

    await DB.set(`comp/${competition.key}/pub`, {
      name: competition.name,
      season: competition.season,
      format: 'group_knockout',
      phase: state.phase,
      teams: state.teams,
      logos: Object.fromEntries(
        members.filter(m => m.team)
               .map(m => [m.team, { url: m.logo_url || null, jersey: m.jersey || '#00c853' }])),
      groups: state.groups,
      fixtures: state.fixtures,
      standings,
      ko: state.ko,
      champion: Competition.champion(state.ko),
      players: Competition.playerStats([
        ...Object.values(state.fixtures).map(list => ({ matches: list })),
        ...state.ko.map(r => ({ matches: r.matches }))
      ]),
      publishedAt: Date.now()
    });

    // Contacts go in their own document, never inside the published snapshot:
    // standings may be public, phone numbers must not be.
    await DB.set('contacts', Object.fromEntries(
      members.filter(m => m.team && m.phone).map(m => [m.team, m.phone])));

    toast('Published — players can see the update');
}

$('btn-publish').addEventListener('click', async () => {
  const btn = $('btn-publish');
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = 'Publishing\u2026';
  try {
    await publish();
    toast('Published \u2014 players can see the update');
  } catch (e) {
    toast(e.isPermission ? 'You cannot publish this competition' : 'Publish failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
});

})();
</script>
</body>
</html>
